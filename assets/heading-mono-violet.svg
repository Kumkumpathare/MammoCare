<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">MammoCare Research Notebooks</title>
  <desc id="desc">A clean, research-focused MammoCare heading in deep aubergine and muted violet, with a minimal cellular mark.</desc>
  <defs>
    <style>
      .wordmark {
        fill: #382454;
        font-family: Inter, "Aptos", "Segoe UI", Arial, sans-serif;
        font-size: 82px;
        font-weight: 700;
        letter-spacing: -2.4px;
      }
      .subtitle {
        fill: #76618F;
        font-family: Inter, "Aptos", "Segoe UI", Arial, sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 4.4px;
      }
      .rule {
        stroke: #C7B9D8;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Minimal cellular mark: a restrained reference to histopathology. -->
  <g transform="translate(326 83)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="25" stroke="#382454" stroke-width="2.4"/>
    <ellipse cx="-7" cy="-4" rx="6.3" ry="8" transform="rotate(24 -7 -4)" stroke="#8D76AA" stroke-width="2"/>
    <ellipse cx="8" cy="5" rx="5.1" ry="7" transform="rotate(-28 8 5)" stroke="#8D76AA" stroke-width="2"/>
    <circle cx="3" cy="-13" r="2.8" fill="#382454" stroke="none"/>
    <circle cx="-14" cy="11" r="2.3" fill="#8D76AA" stroke="none"/>
    <circle cx="15" cy="-13" r="2.5" fill="#382454" stroke="none"/>
  </g>

  <text class="wordmark" x="374" y="111">MammoCare</text>

  <g class="rule">
    <line x1="355" y1="174" x2="393" y2="174"/>
    <line x1="807" y1="174" x2="845" y2="174"/>
  </g>
  <text class="subtitle" x="600" y="181" text-anchor="middle">RESEARCH NOTEBOOKS</text>
</svg>
