[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MammoCare"
version = "0.1.1"
description = "Collaborative research at the intersection of breast histopathology, data science, and deep learning."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Aryan Patel", email = "aryan.timeless@proton.me" },
    { name = "Kumkum Pathare", email = "pawarkumkum3@gmail.com" },
]
dependencies = [
    "ipython",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
